<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-width: 260px; padding: 14px; }
    h1 { font-size: 18px; color: #4f46e5; margin: 0 0 6px 0; }
    p { font-size: 13px; color: #6b7280; margin: 0 0 10px 0; }
    .knopf { width: 100%; }
    .about { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h1 data-i18n="appTitle">Schatten</h1>
  <p data-i18n="popupHint">Open any YouTube video with subtitles: the script appears next to it.</p>
  <button id="oeffnen" class="knopf" data-i18n="popupOpen">Open my library</button>
  <p class="about">Schatten · <span data-i18n="aboutMade">made by Moly Ashraf</span></p>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
